<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Style.css">
    <title>Mini Car Racing</title>
</head>

<body>
    <h1>Racing Car</h1>
    <p>Level: 3 | Score: 100</p>

    <div class="racing-track">
        <div class="player-car">
            <img src="player.png" alt="Player Car">
        </div>
        <div class="opponent-car">
            <img src="opponent.png" alt="Opponent Car">
        </div>
    </div>

    <div class="instruction">
        <p>Click on play button to run.<br>
            Your car is in white and opponent car is in red.<br> You can move your car using arrow keys. Avoid collision with opponent car to score points.
        </p>
    </div>

    <button class="play-button">Play</button>
</body>

</html>
</html>
